<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar tarefa</title>
</head>
<body>
    
{% extends "base.html" %}

{% block title %}Nova tarefa · TechFlow{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Nova tarefa</h1>
        <p class="page-subtitle">Cadastre uma nova tarefa para o time.</p>
    </div>
</div>

<form class="task-form" method="POST" action="{{ url_for('main.criar_tarefa') }}">
    <div class="form-group">
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex: Revisar pull request" required>
    </div>

    <div class="form-group">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" rows="4" placeholder="Detalhe o que precisa ser feito"></textarea>
    </div>

    <div class="form-group">
        <label for="prioridade">Prioridade</label>
        <select id="prioridade" name="prioridade">
            <option value="alta">Alta</option>
            <option value="media" selected>Média</option>
            <option value="baixa">Baixa</option>
        </select>
    </div>

    <div class="form-actions">
        <a href="{{ url_for('main.pagina_inicial') }}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar tarefa</button>
    </div>
</form>

{% endblock %}
    
</body>
</html>
